name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    name: Protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - run: npm test
      - run: node packages/server/scripts/patch-server.ts
  browser:
    name: Browser collaboration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install video validation tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Run browser collaboration tests
        env:
          DEMO_VIDEO_DIR: site
        run: npm run test:e2e
      - name: Validate collaboration recording
        run: node scripts/verify-collaboration-demo.ts
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        with:
          name: collaboration-demo
          path: site/collaboration-demo.webm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: packages/e2e/test-results/
  benchmark:
    name: Protocol benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run benchmark
      - run: node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('benchmark/results.json'));if(r.results.length!==4||r.results.filter(x=>x.count<=100).some(x=>x.status!=='passed'))process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-benchmarks
          path: benchmark/results.json
  report:
    name: Benchmark report
    needs: [benchmark, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          name: protocol-benchmarks
          path: benchmark
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: collaboration-demo
          path: site
      - name: Generate and validate report
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          REQUIRE_DEMO_VIDEO: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: |
          node scripts/generate-benchmark-report.ts
          node scripts/verify-benchmark-report.ts
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    name: Deploy benchmark report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
