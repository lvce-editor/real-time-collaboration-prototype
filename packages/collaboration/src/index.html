<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LVCE · Collaboration prototype</title><link rel="stylesheet" href="/style.css"><script type="module" src="/client.js"></script></head>
<body>
<header><strong>LVCE / Collaboration prototype</strong><span id="connection" role="status">Not connected</span></header>
<section id="lobby">
<h1>Work on a project together</h1>
<p>Host a text project, then share its invitation. Guests start with read-only access.</p>
<label>Your name <input id="name" value="Collaborator" maxlength="60"></label>
<label>Optional project folder <input id="folder" type="file" webkitdirectory multiple></label>
<button id="host">Host project</button>
<label>Invitation UUID <input id="invitation" autocomplete="off"></label><button id="join">Join project</button>
<p id="error" role="alert"></p>
</section>
<main id="workspace" hidden>
<aside><h2>Project</h2><nav id="files" aria-label="Project files"></nav><h2>Participants</h2><div id="members"></div></aside>
<section class="workbench"><div class="toolbar"><strong id="filename"></strong><span id="permission"></span><button id="request">Request write access</button><button id="download">Download file</button><button id="leave">Leave</button></div><div id="editor" aria-label="Shared editor"></div>
<div class="invite"><label>Invite link <input id="invite-link" readonly></label></div>
<section class="output"><div class="toolbar"><strong>Output · Collaboration</strong><label>Log verbosity <select id="verbosity"><option value="off">Off</option><option value="info" selected>Info</option><option value="debug">Debug</option><option value="trace">Trace</option></select></label><button id="clear">Clear output</button></div><pre id="output" role="log" aria-label="Collaboration output"></pre></section>
</section>
</main>
</body></html>
